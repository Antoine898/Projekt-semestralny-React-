<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a31">
  <title>Konto LigaScore</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true">L</span>
      <span>Liga<span class="brand-accent">Score</span></span>
    </header>

    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">TWOJE KONTO</p>
      <h1 id="page-title">Witaj w LigaScore</h1>
      <p class="intro">Załóż konto lub zaloguj się, aby korzystać z własnego profilu.</p>

      <div id="auth-view">
        <div class="tabs" role="tablist" aria-label="Rodzaj formularza">
          <button class="tab active" id="login-tab" type="button" role="tab" aria-selected="true">Logowanie</button>
          <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false">Rejestracja</button>
        </div>

        <form id="auth-form">
          <label for="email">Adres e-mail</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>

          <label for="password">Hasło</label>
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required>
          <p id="password-hint" class="hint" hidden>Użyj co najmniej 12 znaków. Długie, unikalne hasło jest bezpieczniejsze.</p>

          <button id="submit-button" class="button" type="submit">Zaloguj się</button>
        </form>
      </div>

      <p id="status-message" class="status" role="status" aria-live="polite"></p>
      <p class="privacy-note">Hasło jest bezpiecznie skracane i nie jest przechowywane w postaci jawnej.</p>
    </section>
    <footer>Bezpieczne konto • LigaScore</footer>
  </main>
</body>
</html>
